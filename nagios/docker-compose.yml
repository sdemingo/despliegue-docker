services:
  nagios:
    image: jasonrivers/nagios:latest
    container_name: nagios_simple
    ports:
      - "8080:80"
    volumes:
      - ./nagios_data/etc:/opt/nagios/etc
      - ./nagios_data/plugins:/usr/local/nagios/libexec 
    environment:
      - NAGIOSADMIN_USER=admin
      - NAGIOSADMIN_PASS=admin123
      - TZ=Europe/Madrid
    restart: always
